<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Kerja Desa Sumberarum, Moyudan, Sleman</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <!-- Form Login Lockscreen -->
    <div id="login-container">
        <div class="login-card">
            <div class="icon-lock">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                </svg>
            </div>
            <h2>PETA KERJA LAHAN SAWAH</h2>
            <p>Desa Sumberarum, Moyudan, Sleman</p>

            <div class="input-group">
                <input type="password" id="input-pass" placeholder="Masukkan Password Akses..."
                    onkeyup="checkEnter(event)">
            </div>

            <button class="btn-access" onclick="verifikasiAkses()">BUKA PETA</button>
            <div class="error-msg" id="error-text">Password salah! Silakan coba lagi.</div>
        </div>
    </div>

    <!-- Area Iframe Web ArcGIS -->
    <div id="iframe-container"></div>

    <script>
        // 03.2004
        const PASSWORD_HASH = "4007b2a326107e0743417c22883fd97588cb213b01a26efa7e737683df1d46b8";
        const ENCRYPTED_URL = "aHR0cHM6Ly9leHBlcmllbmNlLmFyY2dpcy5jb20vZXhwZXJpZW5jZS9kYWRlNDEwOGQ0ZDc0OGFiYWU1NjFiMDViYWY3YjgwYS8=";

        function verifikasiAkses() {
            const inputPass = document.getElementById('input-pass').value;
            const errorText = document.getElementById('error-text');

            // Hash inputan user
            const inputHash = CryptoJS.SHA256(inputPass).toString();

            if (inputHash === PASSWORD_HASH) {
                // Sembunyikan form login
                document.getElementById('login-container').style.display = 'none';

                // Decode URL dari Base64
                const realURL = atob(ENCRYPTED_URL);

                // Inject Iframe secara dinamis
                const container = document.getElementById('iframe-container');
                container.style.display = 'block';

                const iframe = document.createElement('iframe');
                iframe.src = realURL;
                iframe.allow = "fullscreen; geolocation"; // Tanpa sandbox agar ArcGIS Hub/Auth berjalan lancar

                container.appendChild(iframe);
            } else {
                errorText.style.display = 'block';
                document.getElementById('input-pass').value = '';
                document.getElementById('input-pass').focus();
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                verifikasiAkses();
            }
        }

        // Proteksi Klik Kanan & Inspect Element
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function (e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>
</body>

</html>
